databaseChangeLog:
  - changeSet:
      id: 2026.09-003-create-schema-indexes
      author: topuch
      dbms: postgresql
      runInTransaction: true
      comment: Add indexes for foreign-key lookups and post retention queries.
      changes:
        - sql:
            sql: |
              CREATE INDEX idx_category_parent_id ON category (parent_id);
              CREATE INDEX idx_posts_profile_id ON posts (profile_id);
              CREATE INDEX idx_posts_category_id ON posts (category_id);
              CREATE INDEX idx_posts_created_at ON posts (created_at);
              CREATE INDEX idx_images_post_id ON images (post_id);
              CREATE INDEX idx_reports_profile_id ON reports (profile_id);
      rollback:
        - sql:
            sql: |
              DROP INDEX IF EXISTS idx_reports_profile_id;
              DROP INDEX IF EXISTS idx_images_post_id;
              DROP INDEX IF EXISTS idx_posts_created_at;
              DROP INDEX IF EXISTS idx_posts_category_id;
              DROP INDEX IF EXISTS idx_posts_profile_id;
              DROP INDEX IF EXISTS idx_category_parent_id;
