databaseChangeLog:
  - changeSet:
      id: 2026.09-001-create-initial-schema
      author: topuch
      dbms: postgresql
      runInTransaction: true
      comment: Create the initial TopUch tables with UUID primary and foreign keys.
      changes:
        - sql:
            sql: |
              CREATE TABLE address (
                  address_id UUID PRIMARY KEY,
                  country_code VARCHAR(255), state VARCHAR(255), city VARCHAR(255),
                  street_name VARCHAR(255), street_number INTEGER, zip_code VARCHAR(255)
              );
              CREATE TABLE category (
                  category_id UUID PRIMARY KEY, name VARCHAR(255), parent_id UUID,
                  CONSTRAINT fk_category_parent FOREIGN KEY (parent_id)
                      REFERENCES category (category_id) ON DELETE RESTRICT
              );
              CREATE TABLE profiles (
                  profile_id UUID PRIMARY KEY, first_name VARCHAR(255), last_name VARCHAR(255),
                  created_at TIMESTAMP(6), phone_number BIGINT, email VARCHAR(255),
                  address_id UUID UNIQUE,
                  CONSTRAINT fk_profiles_address FOREIGN KEY (address_id)
                      REFERENCES address (address_id) ON DELETE RESTRICT
              );
              CREATE TABLE posts (
                  post_id UUID PRIMARY KEY, title VARCHAR(255), description VARCHAR(255),
                  price NUMERIC(38, 2), created_at TIMESTAMP(6), condition VARCHAR(255),
                  profile_id UUID, category_id UUID,
                  CONSTRAINT fk_posts_profile FOREIGN KEY (profile_id)
                      REFERENCES profiles (profile_id) ON DELETE RESTRICT,
                  CONSTRAINT fk_posts_category FOREIGN KEY (category_id)
                      REFERENCES category (category_id) ON DELETE RESTRICT
              );
              CREATE TABLE images (
                  image_id UUID PRIMARY KEY, created_at TIMESTAMP(6),
                  image_address VARCHAR(255), post_id UUID,
                  CONSTRAINT fk_images_post FOREIGN KEY (post_id)
                      REFERENCES posts (post_id) ON DELETE CASCADE
              );
              CREATE TABLE reports (
                  report_id UUID PRIMARY KEY, reported_at TIMESTAMP(6),
                  abuse_type VARCHAR(255), message VARCHAR(255), post_id UUID UNIQUE,
                  profile_id UUID,
                  CONSTRAINT fk_reports_post FOREIGN KEY (post_id)
                      REFERENCES posts (post_id) ON DELETE CASCADE,
                  CONSTRAINT fk_reports_profile FOREIGN KEY (profile_id)
                      REFERENCES profiles (profile_id) ON DELETE RESTRICT
              );
              CREATE TABLE post_likes (
                  post_id UUID NOT NULL, profile_id UUID NOT NULL,
                  PRIMARY KEY (post_id, profile_id),
                  CONSTRAINT fk_post_likes_post FOREIGN KEY (post_id)
                      REFERENCES posts (post_id) ON DELETE CASCADE,
                  CONSTRAINT fk_post_likes_profile FOREIGN KEY (profile_id)
                      REFERENCES profiles (profile_id) ON DELETE CASCADE
              );
      rollback:
        - sql:
            sql: |
              DROP TABLE IF EXISTS post_likes;
              DROP TABLE IF EXISTS reports;
              DROP TABLE IF EXISTS images;
              DROP TABLE IF EXISTS posts;
              DROP TABLE IF EXISTS profiles;
              DROP TABLE IF EXISTS category;
              DROP TABLE IF EXISTS address;
